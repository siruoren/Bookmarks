<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeeTab</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

/* === 默认变量（暗色） === */
:root {
  --bg: #1a1a2e;
  --bg2: #16213e;
  --bg3: #0f3460;
  --card: rgba(255,255,255,0.06);
  --card-hover: rgba(255,255,255,0.1);
  --text: #e0e0e0;
  --text2: #a0a0b0;
  --primary: #7b8ad6;
  --primary-dark: #5b6abf;
  --border: rgba(255,255,255,0.08);
  --border-active: rgba(123,138,214,0.4);
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --weather-bg: rgba(255,255,255,0.06);
  --bm-icon-bg: rgba(123,138,214,0.12);
}

/* === 亮色主题 === */
[data-theme="light"] {
  --bg: #ffffff;
  --bg2: #f8f9fa;
  --bg3: #f0f1f3;
  --card: rgba(255,255,255,0.95);
  --card-hover: rgba(255,255,255,1);
  --text: #1a2332;
  --text2: #5a6a7a;
  --primary: #5b6abf;
  --primary-dark: #4a57a3;
  --border: rgba(0,0,0,0.1);
  --border-active: rgba(91,106,191,0.4);
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --weather-bg: rgba(0,0,0,0.04);
  --bm-icon-bg: rgba(91,106,191,0.08);
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
  color: var(--text);
  transition: background 0.4s, color 0.4s;
}

/* 亮色主题：纯色背景，去除渐变模糊感 */
[data-theme="light"] body {
  background: #ffffff;
}

/* 壁纸模式：加暗色遮罩保证文字可读 */
body.has-wallpaper::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 0;
}

body.has-wallpaper > * {
  position: relative;
  z-index: 1;
}

[data-theme="light"] body.has-wallpaper::before {
  background: rgba(255,255,255,0.1);
}

/* === 顶栏 === */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: transparent;
  z-index: 100;
}

.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}

.topbar-center {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

/* === 天气组件 === */
.weather-widget {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--weather-bg);
  border-radius: 8px;
  font-size: 13px;
  position: relative;
  cursor: default;
}

.weather-icon {
  font-size: 18px;
  cursor: pointer;
}

.weather-temp {
  font-weight: 600;
  font-size: 14px;
}

.weather-city {
  color: var(--text2);
  font-size: 12px;
}

[data-theme="light"] .weather-widget {
  background: rgba(91,106,191,0.08);
}

[data-theme="light"] .weather-temp {
  color: #2d3748;
}

[data-theme="light"] .weather-city {
  color: #4a5568;
}

.weather-city-input {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  background: var(--card);
  color: var(--text);
  z-index: 300;
  margin-top: 4px;
  backdrop-filter: blur(10px);
}

.weather-city-input.show { display: block; }

[data-theme="light"] .weather-city-input {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* === 主题切换 === */
.theme-toggle {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--weather-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background 0.2s;
  font-size: 16px;
}

.theme-toggle:hover { background: var(--card-hover); }

[data-theme="light"] .theme-toggle {
  background: rgba(91,106,191,0.08);
  color: #4a5568;
}

/* === 主容器 === */
.container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 68px 24px 0;
  overflow-y: auto;
  scroll-behavior: smooth;
  scrollbar-gutter: stable;
}

.container::-webkit-scrollbar { width: 4px; }
.container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* === 顶栏时钟和日期 === */
.topbar-clock {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 1px;
}

.topbar-date {
  font-size: 12px;
  color: var(--text2);
  text-align: right;
}

.topbar-weekday {
  font-size: 12px;
  color: var(--text2);
  text-align: left;
}

[data-theme="light"] .topbar-clock { color: #2d3748; }
[data-theme="light"] .topbar-date { color: #4a5568; }
[data-theme="light"] .topbar-weekday { color: #4a5568; }

/* === 搜索框 === */
.search-section {
  width: 100%;
  max-width: 600px;
  margin: 6vh auto 24px;
  flex-shrink: 0;
}

.search-box {
  position: relative;
  width: 100%;
}

.search-box .search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text2);
}

.search-box input {
  width: 100%;
  padding: 14px 80px 14px 46px;
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 16px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
  backdrop-filter: blur(10px);
}

.search-clear {
  position: absolute;
  right: 46px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.12);
  color: var(--text2);
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  transition: background 0.2s;
  padding: 0;
  line-height: 1;
}
.search-clear.show { display: flex; }
.search-clear:hover { background: rgba(255,255,255,0.2); }

[data-theme="light"] .search-clear { background: rgba(0,0,0,0.06); color: var(--text2); }
[data-theme="light"] .search-clear:hover { background: rgba(0,0,0,0.12); }

.search-go {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--primary);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.search-go:hover { background: var(--primary-dark); }

.search-box input:focus {
  background: var(--card-hover);
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(91,106,191,0.15);
}

.search-box input::placeholder { color: var(--text2); }

[data-theme="light"] .search-box input {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* === 最近使用 === */
.top-visited {
  margin-bottom: 20px;
}

.top-visited-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.top-visited-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 0 4px 0;
}

.top-visited-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  text-decoration: none;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
}

[data-theme="light"] .top-visited-item {
  background: rgba(255,255,255,0.85);
  border-color: rgba(0,0,0,0.08);
  color: var(--text);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.top-visited-item:hover {
  background: rgba(0,0,0,0.4);
  border-color: var(--border-active);
}

[data-theme="light"] .top-visited-item:hover {
  background: rgba(255,255,255,0.95);
}

.top-visited-item .bm-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--bm-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--primary);
  flex-shrink: 0;
  font-weight: 700;
  overflow: hidden;
}

.top-visited-item .bm-icon img { width: 16px; height: 16px; border-radius: 2px; }

.top-visited-info { display: flex; align-items: center; gap: 6px; }

.top-visited-name {
  font-size: 13px;
  font-weight: 500;
  max-width: 120px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}

[data-theme="light"] .top-visited-name { text-shadow: none; }

/* 晃动模式 */
@keyframes shake {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-3deg); }
  40% { transform: rotate(3deg); }
  60% { transform: rotate(-2deg); }
  80% { transform: rotate(2deg); }
}

.top-visited-item.shake {
  animation: shake 1.2s ease infinite;
}

.remove-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #e74c3c;
  color: #fff;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  border: 2px solid #fff;
  line-height: 1;
  font-weight: 600;
}

[data-theme="light"] .remove-badge { border-color: #f0f2f5; }

/* === 内容区 === */
.content {
  width: 100%;
  max-width: 1200px;
  flex: 1;
  padding-bottom: 48px;
}

/* === 目录列表（紧凑文字条目 + 毛玻璃） === */
.category-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 4px;
  margin-bottom: 20px;
}

.cat-card {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12);
  transition: all 0.15s;
  user-select: none;
  white-space: nowrap;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

[data-theme="light"] .cat-card {
  background: rgba(255,255,255,0.85);
  border-color: rgba(0,0,0,0.08);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.cat-card:hover {
  background: rgba(0,0,0,0.5);
  border-color: var(--border-active);
}

[data-theme="light"] .cat-card:hover {
  background: rgba(255,255,255,0.95);
}

.cat-card.active {
  background: rgba(123,138,214,0.35);
  border-color: var(--border-active);
}

[data-theme="light"] .cat-card.active {
  background: rgba(91,106,191,0.18);
}

.cat-card .cat-icon { font-size: 14px; }
.cat-card .cat-name { font-size: 13px; font-weight: 600; line-height: 1.4; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
[data-theme="light"] .cat-card .cat-name { color: #1a1a2e; text-shadow: none; }
.cat-card .cat-count { font-size: 11px; color: rgba(255,255,255,0.7); }
[data-theme="light"] .cat-card .cat-count { color: var(--text2); }

/* === 书签展开区（点击目录后显示在目录下方） === */
.bookmark-panel {
  margin-bottom: 28px;
  animation: slideDown 0.25s ease;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.bookmark-panel-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding: 0 4px;
}

.bookmark-panel-header .panel-icon { font-size: 20px; }
.bookmark-panel-header .panel-title { font-size: 16px; font-weight: 600; }
.bookmark-panel-header .panel-path { font-size: 12px; color: var(--text2); }
.bookmark-panel-header .panel-count { font-size: 12px; color: var(--text2); }
.bookmark-panel-header .panel-close {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--card);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text2);
  font-size: 14px;
  transition: all 0.2s;
}

.bookmark-panel-header .panel-close:hover { background: var(--card-hover); color: var(--text); }

/* 书签网格 */
.bookmark-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}

.bookmark-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(0,0,0,0.35);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  text-decoration: none;
  color: #fff;
  transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

[data-theme="light"] .bookmark-item {
  background: rgba(255,255,255,0.85);
  border-color: rgba(0,0,0,0.08);
  color: var(--text);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.bookmark-item:hover {
  background: rgba(0,0,0,0.5);
  border-color: var(--primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

[data-theme="light"] .bookmark-item:hover {
  background: rgba(255,255,255,0.95);
  border-color: var(--primary);
}

.bookmark-item .bm-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--bm-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--primary);
  flex-shrink: 0;
  font-weight: 700;
  overflow: hidden;
}

.bookmark-item .bm-icon img { width: 20px; height: 20px; border-radius: 3px; }

.bookmark-item .bm-info { flex: 1; min-width: 0; }

.bookmark-item .bm-title {
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
}

[data-theme="light"] .bookmark-item .bm-title { text-shadow: none; }

.bookmark-item:hover .bm-title { color: var(--primary); }

.bookmark-item .bm-url {
  font-size: 11px;
  color: rgba(255,255,255,0.6);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

[data-theme="light"] .bookmark-item .bm-url { color: var(--text2); }

/* 搜索结果高亮 */
.search-category {
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  margin: 16px 0 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* 搜索引擎提示条 */
.search-engine-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  text-decoration: none;
  transition: all 0.2s;
  cursor: pointer;
}

[data-theme="light"] .search-engine-hint {
  background: rgba(255,255,255,0.85);
  border-color: rgba(0,0,0,0.08);
  color: var(--text2);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

.search-engine-hint:hover {
  background: rgba(123,138,214,0.25);
  border-color: var(--border-active);
  color: #fff;
}

[data-theme="light"] .search-engine-hint:hover {
  background: rgba(91,106,191,0.12);
  color: var(--text);
}

.search-engine-hint svg { flex-shrink: 0; opacity: 0.7; }

/* 分类图标颜色 */
.ico-0 { color: #e74c3c; } .ico-1 { color: #e67e22; } .ico-2 { color: #f1c40f; } .ico-3 { color: #2ecc71; }
.ico-4 { color: #1abc9c; } .ico-5 { color: #3498db; } .ico-6 { color: #9b59b6; } .ico-7 { color: #e91e63; }

/* 空状态 */
.empty { text-align: center; padding: 40px; color: var(--text2); font-size: 14px; }

/* 更新信息 - 固定底部居中 */
.update-info {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  font-size: 11px;
  color: var(--text2);
  opacity: 0.6;
  text-align: center;
  padding: 8px 0 12px;
  z-index: 50;
  pointer-events: none;
}

/* Toast */
.toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 24px;
  border-radius: 8px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-size: 13px;
  z-index: 1000;
  transition: transform 0.3s, opacity 0.3s;
  backdrop-filter: blur(10px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

[data-theme="light"] .toast {
  background: rgba(0,0,0,0.75);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* === 响应式 === */
@media (max-width: 768px) {
  .category-grid { gap: 4px 3px; }
  .cat-card { padding: 4px 8px; font-size: 12px; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .topbar-left, .topbar-center { gap: 8px; }
  .weather-city { display: none; }
}

@media (max-width: 480px) {
  .bookmark-grid { grid-template-columns: 1fr; }
  .category-grid { gap: 3px 2px; }
  .cat-card { padding: 3px 6px; font-size: 11px; }
  .topbar-date { display: none; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="weather-widget" id="weather">
      <span class="weather-icon" id="weatherIcon">🌤️</span>
      <span class="weather-temp" id="weatherTemp">--°</span>
      <span class="weather-city" id="weatherCity"></span>
      <input type="text" class="weather-city-input" id="weatherCityInput" placeholder="输入城市">
    </div>
  </div>
  <div class="topbar-center">
    <div class="topbar-date" id="date"></div>
    <div class="topbar-clock" id="clock"></div>
    <div class="topbar-weekday" id="weekday"></div>
  </div>
  <div class="topbar-right">
    <div class="theme-toggle" id="themeToggle" title="切换主题">
      <span class="theme-icon" id="themeIcon">🌙</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="search-section">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
      <input type="text" id="searchInput" placeholder="搜索书签或输入网址..." autocomplete="off">
      <button class="search-clear" id="searchClear" title="清空">✕</button>
      <button class="search-go" id="searchGo" title="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="update-info" id="updateInfo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// === 设备ID管理 ===
function getDeviceId() {
  let deviceId = localStorage.getItem('bookmarks_device_id');
  if (!deviceId) {
    deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('bookmarks_device_id', deviceId);
  }
  return deviceId;
}
const deviceId = getDeviceId();

// === 全局状态 ===
let allCategories = [];
let _validCategories = null;
let activeCat = null;
let isSearchMode = false;
let isShakeMode = false;

// 分类图标
const CAT_ICONS = ['📂','🎬','📝','💻','🎮','🎧','🔧','🏠','📚','💰','🛒','✈️','🖼️','👔','🔗','🌍','📊','🗂️','⚙️','🧰','📁','🔔','📌','🎯'];
const catIcon = i => CAT_ICONS[i % CAT_ICONS.length];

// === 时钟 ===
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('clock').textContent = `${h}:${m}`;

  const {lunar, term} = getLunarInfo(now);
  const dateStr = now.toLocaleDateString('zh-CN', {year: 'numeric', month: 'long', day: 'numeric'});
  document.getElementById('date').textContent = lunar ? `${dateStr} ${lunar}` : dateStr;

  const weekday = now.toLocaleDateString('zh-CN', {weekday: 'short'});
  document.getElementById('weekday').textContent = term ? `${weekday} ${term}` : weekday;
}

function getLunarInfo(date) {
  const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
  const lunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
    '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
    '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  const terms = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满',
    '芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降',
    '立冬','小雪','大雪','冬至'];

  const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();

  // 节气检查
  let termName = '';
  const termIdx = m * 2 + (d > 15 ? 1 : 0);
  if (termIdx < terms.length) {
    const termDates = [6,20,4,19,6,21,5,20,6,21,6,22,7,23,7,23,8,23,8,23,7,22,7,22];
    if (Math.abs(d - termDates[termIdx]) <= 1) termName = terms[termIdx];
  }

  const SPRINGS = {
    2024: { m: 2, d: 10, leap: 0 },
    2025: { m: 1, d: 29, leap: 6 },
    2026: { m: 2, d: 17, leap: 0 },
    2027: { m: 2, d: 6,  leap: 0 },
    2028: { m: 1, d: 26, leap: 0 },
    2029: { m: 2, d: 13, leap: 0 },
    2030: { m: 2, d: 3,  leap: 0 },
  };

  let springInfo = SPRINGS[y];
  let springDate = springInfo ? new Date(y, springInfo.m - 1, springInfo.d) : null;
  let diffDays = springDate ? Math.floor((date - springDate) / 86400000) : -1;

  if (diffDays < 0) {
    const prevInfo = SPRINGS[y - 1];
    if (prevInfo) {
      springInfo = prevInfo;
      springDate = new Date(y - 1, prevInfo.m - 1, prevInfo.d);
      diffDays = Math.floor((date - springDate) / 86400000);
    } else {
      const dayOfYear = Math.floor((date - new Date(y, 0, 0)) / 86400000);
      const lunarDay = lunarDays[(dayOfYear + 15) % 30] || '';
      return { lunar: lunarDay, term: termName };
    }
  }

  const leapMonth = springInfo.leap;
  const totalMonths = leapMonth > 0 ? 13 : 12;
  let remaining = diffDays;
  let monthIdx = 0;

  for (let i = 0; i < totalMonths; i++) {
    const days = (i % 2 === 0) ? 30 : 29;
    if (remaining < days) {
      monthIdx = i;
      break;
    }
    remaining -= days;
    if (i === totalMonths - 1) { monthIdx = i; }
  }

  let monthName;
  if (leapMonth > 0 && monthIdx === leapMonth) {
    monthName = '闰' + lunarMonthNames[leapMonth - 1] + '月';
  } else if (leapMonth > 0 && monthIdx > leapMonth) {
    monthName = lunarMonthNames[monthIdx - 1] + '月';
  } else {
    monthName = lunarMonthNames[Math.min(monthIdx, 11)] + '月';
  }

  const dayName = lunarDays[remaining] || '';
  return { lunar: monthName + dayName, term: termName };
}

// === 主题 ===
function initTheme() {
  const theme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
}

function updateThemeIcon(theme) {
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '🌙' : '☀️';
}

// === 天气 ===
const weatherIcons = {
  '晴': '☀️', '多云': '⛅', '阴': '☁️', '雨': '🌧️',
  '雪': '❄️', '雾': '🌫️', '雷阵雨': '⛈️', '小雨': '🌦️', '大风': '💨'
};

function getWeatherIcon(desc) {
  for (const key in weatherIcons) if (desc.includes(key)) return weatherIcons[key];
  return '🌤️';
}

function getWeatherDesc(code) {
  const codes = {0:'晴',1:'晴',2:'多云',3:'多云',45:'雾',48:'雾',51:'小雨',53:'小雨',55:'小雨',61:'雨',63:'雨',65:'雨',71:'雪',73:'雪',75:'雪',80:'阵雨',81:'阵雨',82:'阵雨',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'};
  return codes[code] || '晴';
}

async function fetchWeather(city) {
  try {
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh`);
    const geoData = await geoRes.json();
    if (!geoData.results || geoData.results.length === 0) return null;
    const {latitude, longitude, name} = geoData.results[0];
    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
    const wd = await weatherRes.json();
    return { city: name, temp: Math.round(wd.current_weather.temperature), weatherCode: wd.current_weather.weathercode };
  } catch (e) { console.error('获取天气失败:', e); return null; }
}

function updateWeatherDisplay(data) {
  if (!data) return;
  const desc = getWeatherDesc(data.weatherCode);
  document.getElementById('weatherIcon').textContent = getWeatherIcon(desc);
  document.getElementById('weatherTemp').textContent = `${data.temp}°`;
  document.getElementById('weatherCity').textContent = data.city;
}

async function initWeather() {
  const city = localStorage.getItem('weatherCity') || '';
  if (city) {
    const data = await fetchWeather(city);
    if (data) updateWeatherDisplay(data);
  }
}

async function toggleCityInput() {
  const input = document.getElementById('weatherCityInput');
  if (input.classList.contains('show')) {
    input.classList.remove('show');
  } else {
    input.classList.add('show');
    input.value = localStorage.getItem('weatherCity') || '';
    input.focus();
  }
}

function handleCityInput(event) {
  if (event.key === 'Enter') {
    const city = event.target.value.trim();
    if (city) {
      localStorage.setItem('weatherCity', city);
      event.target.classList.remove('show');
      fetchWeather(city).then(data => { if (data) updateWeatherDisplay(data); });
    }
  }
}

// === 工具函数 ===
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
const escAttr = escHtml;

function cleanTitle(title) {
  if (!title) return '';
  let t = title;
  t = t.replace(/\s*[-_|–—]\s*(CSDN博客|博客园|简书|知乎|Stack Overflow|GitHub|Gitee|GitLab|Jenkins|Docker|Kubernetes|官方|官网|首页|Download|Documentation|Sign In|Login).*$/gi, '');
  t = t.replace(/\s*[-_|–—]\s*$/, '');
  t = t.trim();
  if (t.length > 50) t = t.substring(0, 47) + '...';
  return t || title;
}

function bmIconHtml(url, title) {
  try {
    const u = new URL(url);
    const fav = u.origin + '/favicon.ico';
    const letter = (title || u.hostname)[0].toUpperCase();
    return `<div class="bm-icon" data-fav="${escAttr(fav)}" data-letter="${escAttr(letter)}">${letter}</div>`;
  } catch { return '<div class="bm-icon">?</div>'; }
}

// Favicon 懒加载
let _favObserver = null;
function getFavObserver() {
  if (_favObserver) return _favObserver;
  _favObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const el = entry.target;
      _favObserver.unobserve(el);
      const fav = el.dataset.fav;
      if (!fav) return;
      const img = new Image();
      img.onload = () => { el.innerHTML = ''; const i = document.createElement('img'); i.src = fav; el.appendChild(i); };
      img.onerror = () => {};
      img.src = fav;
    });
  }, { rootMargin: '200px' });
  return _favObserver;
}

function loadFavicons() {
  const icons = document.querySelectorAll('.bm-icon[data-fav]');
  if (icons.length === 0) return;
  const observer = getFavObserver();
  icons.forEach(el => observer.observe(el));
}

// === 数据加载 ===
async function loadData() {
  try {
    const resp = await fetch('/api/bookmarks');
    if (resp.ok) {
      const data = await resp.json();
      renderData(data);
      return;
    }
  } catch (e) { console.error('从后端获取数据失败:', e); }
  document.getElementById('content').innerHTML = '<div class="empty">无法连接后端服务</div>';
}

// === 最近使用（后端API） ===
async function recordVisit(url, title) {
  if (!url) return;
  try {
    await fetch('/api/visit', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title: title || url, url: url, device_id: deviceId})
    });
  } catch (e) { console.error('记录访问失败:', e); }
}

async function removeVisited(url) {
  try {
    await fetch('/api/recent/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({url: url, device_id: deviceId})
    });
  } catch (e) { console.error('删除最近使用失败:', e); }
  refreshTopVisited();
}

async function getRecentVisited() {
  try {
    const resp = await fetch(`/api/recent?device_id=${encodeURIComponent(deviceId)}`);
    const data = await resp.json();
    const items = data.items || [];
    return items.map(item => ({ url: item.url, title: item.title, lastVisit: item.timestamp || 0 }));
  } catch (e) { console.error('获取最近使用失败:', e); return []; }
}

function renderTopVisited(items) {
  if (!items || items.length === 0) return '';
  let html = '<div class="top-visited">';
  html += '<div class="top-visited-title">最近使用</div>';
  html += '<div class="top-visited-grid">';
  items.forEach(item => {
    const t = escHtml(cleanTitle(item.title));
    html += `<a class="top-visited-item ${isShakeMode ? 'shake' : ''}" href="${escAttr(item.url)}" target="_blank" rel="noopener" data-url="${escAttr(item.url)}">
      ${isShakeMode ? '<span class="remove-badge" data-action="remove-visited">✕</span>' : ''}
      ${bmIconHtml(item.url, item.title)}
      <div class="top-visited-info">
        <div class="top-visited-name">${t}</div>
      </div>
    </a>`;
  });
  html += '</div></div>';
  return html;
}

async function refreshTopVisited() {
  const slot = document.getElementById('topVisitedSlot');
  if (!slot) return;
  const items = await getRecentVisited();
  if (items.length > 0) {
    slot.innerHTML = renderTopVisited(items);
    loadFavicons();
  } else {
    slot.innerHTML = '';
  }
}

// === 目录信息 ===
function getCategories() {
  return allCategories.filter(c => c.category !== '__root_bookmarks__');
}

// === 渲染 ===
function getValidCategories() {
  if (!_validCategories) {
    _validCategories = getCategories().filter(c => c.items.length > 0);
  }
  return _validCategories;
}

function renderData(data) {
  allCategories = data.categories || [];
  _validCategories = null;
  const total = data.total || 0;
  const updateTime = data.last_update ? new Date(data.last_update * 1000).toLocaleString('zh-CN') : '';
  if (updateTime) document.getElementById('updateInfo').textContent = `${total} 书签 | 更新于 ${updateTime}`;
  if (isSearchMode) return;
  renderMainView();
}

function renderMainView() {
  const content = document.getElementById('content');
  const validCategories = getValidCategories();

  let html = '';
  html += '<div id="topVisitedSlot"></div>';
  html += '<div class="category-grid">';
  validCategories.forEach((cat, i) => {
    const shortName = cat.category.split(' / ').pop();
    const isActive = activeCat === cat.category;
    html += `<div class="cat-card ${isActive ? 'active' : ''}" data-cat="${escAttr(cat.category)}" data-idx="${i}">
      <div class="cat-icon ico-${i % 8}">${catIcon(i)}</div>
      <div class="cat-name">${escHtml(shortName)}</div>
      <div class="cat-count">${cat.items.length} 书签</div>
    </div>`;
  });
  html += '</div>';

  if (activeCat) {
    html += renderBookmarkPanel(activeCat, validCategories);
  }

  content.innerHTML = html;
  bindContentEvents();
  loadFavicons();

  // 同步填充最近使用（避免异步导致布局抖动）
  getRecentVisited().then(items => {
    const slot = document.getElementById('topVisitedSlot');
    if (slot && items.length > 0) {
      slot.innerHTML = renderTopVisited(items);
      loadFavicons();
    }
  });
}

function renderBookmarkPanel(categoryName, validCategories) {
  const catIdx = validCategories.findIndex(c => c.category === categoryName);
  const cat = validCategories[catIdx];
  if (!cat) return '';

  const shortName = categoryName.split(' / ').pop();
  const parentPath = categoryName.includes(' / ') ? categoryName.substring(0, categoryName.lastIndexOf(' / ')) : '';

  let html = '<div class="bookmark-panel">';
  html += '<div class="bookmark-panel-header">';
  html += `<span class="panel-icon ico-${catIdx % 8}">${catIcon(catIdx)}</span>`;
  html += `<span class="panel-title">${escHtml(shortName)}</span>`;
  if (parentPath) html += `<span class="panel-path">${escHtml(parentPath)}</span>`;
  html += `<span class="panel-count">${cat.items.length} 个书签</span>`;
  html += '<div class="panel-close" data-action="close-panel">✕</div>';
  html += '</div>';

  html += '<div class="bookmark-grid">';
  cat.items.forEach(item => {
    const t = escHtml(shortName) + ' - ' + escHtml(cleanTitle(item.title));
    const u = escHtml(item.url);
    html += `<a class="bookmark-item" href="${escAttr(item.url)}" target="_blank" rel="noopener">
      ${bmIconHtml(item.url, item.title)}
      <div class="bm-info"><div class="bm-title">${t}</div><div class="bm-url">${u}</div></div>
    </a>`;
  });
  html += '</div></div>';
  return html;
}

function toggleCategory(catName) {
  const wasActive = activeCat === catName;
  activeCat = wasActive ? null : catName;
  isSearchMode = false;

  const content = document.getElementById('content');
  content.querySelectorAll('.cat-card').forEach(card => {
    card.classList.toggle('active', card.dataset.cat === activeCat);
  });

  const oldPanel = content.querySelector('.bookmark-panel');
  if (oldPanel) oldPanel.remove();

  // 收起时重置滚动位置，避免残留黑条
  if (wasActive) {
    document.querySelector('.container').scrollTop = 0;
  }

  if (activeCat) {
    const validCategories = getValidCategories();
    const panelHtml = renderBookmarkPanel(activeCat, validCategories);
    if (panelHtml) {
      const grid = content.querySelector('.category-grid');
      grid.insertAdjacentHTML('afterend', panelHtml);
      loadFavicons();
    }
  }
}

function closeBookmarkPanel() {
  activeCat = null;
  const content = document.getElementById('content');
  content.querySelectorAll('.cat-card').forEach(card => card.classList.remove('active'));
  const panel = content.querySelector('.bookmark-panel');
  if (panel) panel.remove();
  document.querySelector('.container').scrollTop = 0;
}

// === 交互 ===
let contentEventsBound = false;
let longPressTimer = null;

function bindContentEvents() {
  if (contentEventsBound) return;
  contentEventsBound = true;
  const content = document.getElementById('content');

  content.addEventListener('click', (e) => {
    if (isShakeMode && !e.target.closest('.top-visited-item')) {
      isShakeMode = false;
      refreshTopVisited();
      return;
    }

    const removeBtn = e.target.closest('[data-action="remove-visited"]');
    if (removeBtn) {
      e.preventDefault();
      e.stopPropagation();
      const item = removeBtn.closest('.top-visited-item');
      const url = item?.dataset.url;
      if (url) removeVisited(url);
      return;
    }

    const bmItem = e.target.closest('a.bookmark-item[href]');
    if (bmItem) {
      recordVisit(bmItem.href, bmItem.querySelector('.bm-title')?.textContent || '');
    }

    const tvItem = e.target.closest('a.top-visited-item[href]');
    if (tvItem) {
      if (isShakeMode) { e.preventDefault(); return; }
      recordVisit(tvItem.href, tvItem.querySelector('.top-visited-name')?.textContent || '');
    }

    // 搜索结果目录卡片点击（展开/收起切换）
    const folderCard = e.target.closest('.cat-card[data-cat]');
    if (folderCard && isSearchMode) {
      const catName = folderCard.dataset.cat;
      const catIdx = parseInt(folderCard.dataset.idx);
      const isActive = folderCard.classList.contains('active');
      content.querySelectorAll('.cat-card').forEach(c => c.classList.remove('active'));
      folderCard.classList.toggle('active', !isActive);
      toggleSearchFolder(catName, catIdx, isActive);
      return;
    }

    const card = e.target.closest('.cat-card[data-cat]');
    if (card) {
      toggleCategory(card.dataset.cat);
      return;
    }

    const closeBtn = e.target.closest('[data-action="close-panel"]');
    if (closeBtn) {
      closeBookmarkPanel();
      return;
    }
  });

  content.addEventListener('pointerdown', (e) => {
    const tvItem = e.target.closest('.top-visited-item');
    if (!tvItem) return;
    longPressTimer = setTimeout(() => {
      isShakeMode = !isShakeMode;
      refreshTopVisited();
    }, 500);
  });

  const cancelLongPress = () => { clearTimeout(longPressTimer); };
  content.addEventListener('pointerup', cancelLongPress);
  content.addEventListener('pointermove', cancelLongPress);
  content.addEventListener('pointercancel', cancelLongPress);
}

// === 搜索 ===
const SEARCH_ENGINE = { name: 'Bing', url: 'https://cn.bing.com/search?q=' };

function openSearch(query) {
  const v = query.trim();
  if (!v) return;
  if (v.startsWith('http') || v.includes('.')) {
    window.location.href = v.startsWith('http') ? v : 'https://' + v;
    return;
  }
  window.location.href = SEARCH_ENGINE.url + encodeURIComponent(v);
}

function setupSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  let timer = null;

  input.addEventListener('input', () => {
    clearTimeout(timer);
    const v = input.value.trim();
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (!v) {
      isSearchMode = false;
      renderMainView();
      return;
    }
    timer = setTimeout(() => { isSearchMode = true; activeCat = null; performSearch(v); }, 200);
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = input.value.trim();
      if (v && (v.startsWith('http') || v.includes('.'))) {
        window.location.href = v.startsWith('http') ? v : 'https://' + v;
      }
    }
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.classList.remove('show');
    isSearchMode = false;
    activeCat = null;
    renderMainView();
    input.focus();
  });

  document.getElementById('searchGo').addEventListener('click', () => {
    openSearch(input.value);
  });
}

async function performSearch(keyword) {
  keyword = keyword.toLowerCase();
  const categories = getCategories();

  const displayKeyword = keyword.length > 30 ? keyword.substring(0, 30) + '...' : keyword;
  const searchUrl = SEARCH_ENGINE.url + encodeURIComponent(keyword);
  let html = `<a class="search-engine-hint" href="${escAttr(searchUrl)}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
    在 ${escHtml(SEARCH_ENGINE.name)} 中搜索「${escHtml(displayKeyword)}」
  </a>`;

  // 分类搜索结果：目录名匹配 vs 书签名/URL匹配
  const catMatched = [];
  const itemMatched = [];

  categories.forEach((cat, idx) => {
    const shortName = cat.category.split(' / ').pop().toLowerCase();
    const isCatMatch = shortName.includes(keyword) || cat.category.toLowerCase().includes(keyword);

    const matchedItems = cat.items.filter(item =>
      item.title.toLowerCase().includes(keyword) ||
      item.url.toLowerCase().includes(keyword)
    );

    if (isCatMatch) {
      catMatched.push({ cat, idx, matchedItems });
    } else if (matchedItems.length > 0) {
      itemMatched.push({ cat, matched: matchedItems, idx });
    }
  });

  let found = catMatched.length > 0 || itemMatched.length > 0;

  // 区域1：匹配的目录（使用 category-grid 卡片样式，类似首页）
  if (catMatched.length > 0) {
    html += '<div class="category-grid">';
    catMatched.forEach(({ cat, idx }) => {
      const shortName = cat.category.split(' / ').pop();
      html += `<div class="cat-card" data-cat="${escAttr(cat.category)}" data-idx="${idx}">
        <div class="cat-icon ico-${idx % 8}">${catIcon(idx)}</div>
        <div class="cat-name">${escHtml(shortName)}</div>
        <div class="cat-count">${cat.items.length} 书签</div>
      </div>`;
    });
    html += '</div>';
    html += '<div id="searchFolderContent"></div>';
  }

  // 区域2：所有匹配的条目列表
  const allMatchedItems = [];
  catMatched.forEach(({ cat, matchedItems }) => {
    matchedItems.forEach(item => allMatchedItems.push({ item, cat }));
  });
  itemMatched.forEach(({ cat, matched }) => {
    matched.forEach(item => allMatchedItems.push({ item, cat }));
  });

  if (allMatchedItems.length > 0) {
    html += '<div class="search-matched-list">';
    html += '<div class="bookmark-grid">';
    allMatchedItems.forEach(({ item, cat }) => {
      const catShortName = cat.category.split(' / ').pop();
      html += `<a class="bookmark-item" href="${escAttr(item.url)}" target="_blank" rel="noopener">
        ${bmIconHtml(item.url, item.title)}
        <div class="bm-info"><div class="bm-title">${escHtml(catShortName)} - ${escHtml(cleanTitle(item.title))}</div><div class="bm-url">${escHtml(item.url)}</div></div>
      </a>`;
    });
    html += '</div></div>';
  }

  if (!found) html += '<div class="empty">未找到匹配的书签</div>';
  document.getElementById('content').innerHTML = html;
  loadFavicons();
}

// 搜索结果：展开/收起目录
function toggleSearchFolder(catName, catIdx, isActive) {
  const container = document.getElementById('searchFolderContent');
  const matchedList = document.querySelector('.search-matched-list');
  if (!container) return;

  if (isActive) {
    // 收起：清空展开内容，显示匹配条目列表
    container.innerHTML = '';
    if (matchedList) matchedList.style.display = '';
  } else {
    // 展开：显示目录全部条目，隐藏匹配条目列表
    if (matchedList) matchedList.style.display = 'none';

    const cat = getCategories().find(c => c.category === catName);
    if (!cat) return;

    const shortName = cat.category.split(' / ').pop();
    let html = '<div class="bookmark-panel">';
    html += '<div class="bookmark-panel-header">';
    html += `<span class="panel-icon ico-${catIdx % 8}">${catIcon(catIdx)}</span>`;
    html += `<span class="panel-title">${escHtml(shortName)}</span>`;
    html += `<span class="panel-count">${cat.items.length} 个书签</span>`;
    html += '</div>';
    html += '<div class="bookmark-grid">';
    cat.items.forEach(item => {
      const t = escHtml(shortName) + ' - ' + escHtml(cleanTitle(item.title));
      const u = escHtml(item.url);
      html += `<a class="bookmark-item" href="${escAttr(item.url)}" target="_blank" rel="noopener">
        ${bmIconHtml(item.url, item.title)}
        <div class="bm-info"><div class="bm-title">${t}</div><div class="bm-url">${u}</div></div>
      </a>`;
    });
    html += '</div></div>';
    container.innerHTML = html;
    loadFavicons();
    container.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// === Bing 每日壁纸 ===
async function loadBingWallpaper() {
  // 从 localStorage 读取设置，默认启用
  const enableWallpaper = localStorage.getItem('enableWallpaper');
  if (enableWallpaper === 'false') {
    removeWallpaper();
    return;
  }

  const cached = localStorage.getItem('bing_wallpaper');
  const cachedDate = localStorage.getItem('bing_wallpaper_date');
  const today = new Date().toISOString().slice(0, 10);

  if (cached && cachedDate === today) {
    applyWallpaper(cached);
    return;
  }

  try {
    const resp = await fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN');
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.images && data.images.length > 0) {
      const imgUrl = 'https://www.bing.com' + data.images[0].url;
      applyWallpaper(imgUrl);
      localStorage.setItem('bing_wallpaper', imgUrl);
      localStorage.setItem('bing_wallpaper_date', today);
    }
  } catch (e) {
    if (cached) applyWallpaper(cached);
  }
}

function applyWallpaper(url) {
  document.body.style.backgroundImage = `url(${url})`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.body.style.backgroundRepeat = 'no-repeat';
  document.body.classList.add('has-wallpaper');
}

function removeWallpaper() {
  document.body.style.backgroundImage = '';
  document.body.style.backgroundSize = '';
  document.body.style.backgroundPosition = '';
  document.body.style.backgroundRepeat = '';
  document.body.classList.remove('has-wallpaper');
}

document.getElementById('weatherCityInput').addEventListener('keydown', handleCityInput);

initTheme();
updateClock();

initWeather();
loadBingWallpaper();
