<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks Nav</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sidebar-w: 240px;
  --primary: #5b6abf;
  --primary-light: #eef0ff;
  --primary-dark: #4a57a3;
  --bg: #f5f6fa;
  --card: #fff;
  --text: #2c3e50;
  --text2: #8795a1;
  --border: #e8ecf1;
  --shadow: 0 2px 8px rgba(91,106,191,.08);
  --radius: 10px;
}

[data-theme="dark"] {
  --primary: #7b8ad6;
  --primary-light: #2a2a4a;
  --primary-dark: #5b6abf;
  --bg: #1a1a2e;
  --card: #252540;
  --text: #e0e0e0;
  --text2: #a0a0b0;
  --border: #3a3a50;
  --shadow: 0 2px 8px rgba(0,0,0,.3);
}
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* === 顶栏 === */
.header { background: linear-gradient(135deg, #5b6abf 0%, #7c5cbf 100%); padding: 14px 24px 12px; display: grid; grid-template-columns: 1fr 4fr 1fr; align-items: center; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 12px rgba(91,106,191,.2); gap: 8px; }
.header .logo-wrap { cursor: pointer; display: flex; align-items: center; gap: 8px; }
.header .logo-icon { display: none; font-size: 24px; }
.header .logo { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.header .stats { color: rgba(255,255,255,.6); font-size: 11px; white-space: nowrap; margin-top: 2px; }
.search-box { justify-self: center; width: 100%; position: relative; }
.search-box input { width: 100%; padding: 14px 50px 14px 20px; border: none; border-radius: 24px; font-size: 16px; outline: none; background: rgba(255,255,255,.92); transition: all .2s; }
.search-box input:focus { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.3); }
.search-box .clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999; font-size: 16px; display: none; line-height: 1; }
.search-box .clear-btn:hover { color: #333; }
.header .refresh-btn { background: rgba(255,255,255,.18); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .2s; justify-self: end; }
.header .refresh-btn:hover { background: rgba(255,255,255,.3); }
.search-icon-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 8px; }
.header .right-col { display: flex; align-items: center; gap: 12px; justify-self: end; }
.theme-toggle { background: rgba(255,255,255,.18); color: #fff; border: none; padding: 0; border-radius: 50px; cursor: pointer; font-size: 18px; transition: background .2s; width: 26px; height: 50px; position: relative; overflow: hidden; }
.theme-toggle:hover { background: rgba(255,255,255,.3); }
.theme-switch { width: 22px; height: 22px; border-radius: 50%; background: #fff; position: absolute; top: 2px; left: 2px; transition: transform 0.3s ease; box-shadow: 0 2px 4px rgba(0,0,0,.2); z-index: 1; }
[data-theme="dark"] .theme-switch { transform: translateY(24px); background: #1a1a2e; }
.theme-toggle::before { content: "☀️"; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: 1; transition: opacity 0.3s; z-index: 2; }
.theme-toggle::after { content: "🌙"; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; opacity: 0.3; transition: opacity 0.3s; z-index: 2; }
[data-theme="dark"] .theme-toggle::before { opacity: 0.3; }
[data-theme="dark"] .theme-toggle::after { opacity: 1; }

/* 日历 */
.calendar { color: #fff; font-size: 13px; text-align: center; line-height: 1.2; white-space: nowrap; }
.calendar .weekday { font-size: 11px; opacity: 0.85; }
.calendar .date { font-size: 15px; font-weight: 600; white-space: nowrap; }

/* 天气 */
.weather { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #fff; font-size: 13px; position: relative; }
.weather-icon { font-size: 20px; cursor: pointer; }
.weather-temp { font-weight: 600; font-size: 14px; }
.weather-city-input { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 100px; padding: 4px 8px; border: none; border-radius: 4px; font-size: 12px; outline: none; z-index: 300; margin-top: 4px; }
.weather-city-input.show { display: block; }

/* === 主体 === */
.main { display: flex; flex: 1; overflow: hidden; }

/* === 左侧栏 === */
.sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; transition: width 0.3s ease; }
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 2px; }
.sidebar.collapsed { width: 0; border-right: none; }
.sidebar-header { padding: 16px 18px 10px; font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sidebar-header .collapse-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; transition: background .2s; }
.sidebar-header .collapse-btn:hover { background: var(--primary-light); color: var(--primary); }
.sidebar-menu { flex: 1; padding: 6px 0; }
.sidebar-expand-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); background: var(--primary); color: #fff; border: none; width: 24px; height: 48px; cursor: pointer; border-radius: 0 8px 8px 0; display: none; align-items: center; justify-content: center; font-size: 14px; z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,.2); transition: left 0.3s ease; }
.sidebar-expand-btn:hover { background: var(--primary-dark); }
.sidebar-expand-btn.visible { display: flex; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; border-radius: 8px; transition: background .2s; user-select: none; }
.menu-item:hover { background: var(--primary-light); }
.menu-item.active { background: var(--primary); color: #fff; }
.menu-item .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.menu-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .cnt { margin-left: auto; font-size: 11px; color: var(--text2); background: var(--bg); padding: 1px 7px; border-radius: 10px; flex-shrink: 0; }

/* === 右侧内容 === */
.content { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

/* 最近常用 */
.recent-section { margin-bottom: 24px; }
.recent-section h2 { font-size: 14px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.recent-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.recent-item { background: var(--card); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all .2s; box-shadow: var(--shadow); max-width: 240px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); position: relative; }
.recent-item .recent-content { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.recent-item:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,106,191,.15); color: var(--primary); }
.recent-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.recent-item .delete-btn { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; background: #e74c3c; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; border: 2px solid var(--card); }
.recent-item .pin-btn { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #f39c12; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; border: 2px solid var(--card); }
.recent-item.pinned .pin-btn { background: #e67e22; }
.recent-item.show-delete .delete-btn { display: flex; }
.recent-item.show-delete .pin-btn { display: flex; }
.recent-item.show-delete .recent-content { animation: shake 0.5s ease-in-out infinite; }
.recent-item.dragging { opacity: 0.5; }
.recent-item.drag-over { border: 2px dashed var(--primary); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px) rotate(-1deg); }
  75% { transform: translateX(3px) rotate(1deg); }
}

/* 分类视图 - 首页概览 */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.overview-card { background: var(--card); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; transition: all .2s; border: 1px solid var(--border); box-shadow: var(--shadow); user-select: none; }
.overview-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(91,106,191,.15); }
.overview-card .oc-icon { font-size: 26px; }
.overview-card .oc-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
.overview-card .oc-count { font-size: 12px; color: var(--text2); }

/* 分类详情 - 书签列表 */
.category-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.category-title .back-btn { font-size: 14px; color: var(--primary); cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.category-title .back-btn:hover { text-decoration: underline; }
.category-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 16px; }

.bookmark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-width: 1400px; margin: 0 auto; }
.bookmark-item { background: var(--card); border-radius: 8px; padding: 12px 14px; transition: all .15s; cursor: pointer; text-decoration: none; color: var(--text); display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); min-height: 56px; }
.bookmark-item:hover { box-shadow: 0 4px 12px rgba(91,106,191,.12); transform: translateY(-1px); }
.bookmark-item .bm-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--primary); flex-shrink: 0; font-weight: 700; overflow: hidden; }
.bookmark-item .bm-icon img { width: 20px; height: 20px; border-radius: 3px; }
.bookmark-item .bm-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bookmark-item .bm-title { font-size: 13.5px; font-weight: 500; line-height: 1.4; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -ms-overflow-style: none; padding-right: 4px; }
.bookmark-item .bm-title::-webkit-scrollbar { display: none; }
.bookmark-item:hover .bm-title { color: var(--primary); }
.bookmark-item .bm-url { font-size: 11px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.loading { text-align: center; padding: 60px; color: var(--text2); font-size: 15px; }
.empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

/* 分类图标颜色 */
.ico-0 { color: #e74c3c; } .ico-1 { color: #e67e22; } .ico-2 { color: #f1c40f; } .ico-3 { color: #2ecc71; }
.ico-4 { color: #1abc9c; } .ico-5 { color: #3498db; } .ico-6 { color: #9b59b6; } .ico-7 { color: #e91e63; }

/* 移动端 */
.sidebar-toggle { display: none; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px; }
.header .left-col { display: flex; align-items: center; gap: 8px; }

/* 大屏: 侧边栏加宽, 更多列 */
@media (min-width: 1400px) {
  :root { --sidebar-w: 280px; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .overview-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}

/* 中屏: 侧边栏缩窄 */
@media (max-width: 1024px) {
  :root { --sidebar-w: 200px; }
  .menu-item { padding: 8px 14px; font-size: 13px; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
}

/* 小屏: 隐藏侧边栏, 汉堡菜单 */
@media (max-width: 768px) {
  .sidebar-toggle { display: block; }
  .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; width: 250px; z-index: 300; transition: left .25s; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
  .sidebar.open { left: 0; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 299; }
  .sidebar-overlay.open { display: block; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .overview-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .header .stats { display: none; }
  .content { padding: 16px 16px 32px; }
  .search-box { width: min(500px, calc(100% - 160px)); }
  
  /* 小屏搜索和刷新按钮样式 */
  .search-icon-btn { display: block; }
  .search-box { display: none; position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% - 120px); z-index: 250; }
  .search-box.show { display: block; }
  .header .refresh-btn { padding: 8px 10px; font-size: 16px; }
  .header .refresh-btn span { display: none; }
  .header { grid-template-columns: auto 1fr auto; }
  .header .left-col { width: auto; }
  
  /* 小屏隐藏日历，简化天气显示 */
  .calendar { display: none; }
  .weather .weather-city { display: none; }
}

/* 超小屏: 只显示图标 */
@media (max-width: 480px) {
  .header .logo { display: none; }
  .header .logo-icon { display: block; }
  .header .stats { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="left-col">
    <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
    <div class="logo-wrap" onclick="location.reload()">
      <span class="logo-icon">&#128208;</span>
      <div>
        <div class="logo">Bookmarks</div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
  <button class="search-icon-btn" onclick="toggleSearchBox()">&#128269;</button>
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="搜索书签..." autocomplete="off">
    <span class="clear-btn" id="clearBtn">&times;</span>
  </div>
  <div class="right-col">
    <div class="calendar" id="calendar"></div>
    <div class="weather" id="weather">
      <span class="weather-icon" id="weatherIcon" onclick="toggleCityInput()">&#127749;</span>
      <span class="weather-temp" id="weatherTemp">--°</span>
      <input type="text" class="weather-city-input" id="weatherCityInput" placeholder="输入城市" onkeypress="handleCityInput(event)">
    </div>
    <div class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题">
      <div class="theme-switch"></div>
    </div>
    <button class="refresh-btn" onclick="location.reload()">&#8635; <span>刷新</span></button>
  </div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>目录导航</span>
      <button class="collapse-btn" onclick="toggleSidebarCollapse()" title="收起/展开侧边栏">◀</button>
    </div>
    <div class="sidebar-menu" id="sidebarMenu"></div>
  </div>
  <button class="sidebar-expand-btn" onclick="toggleSidebarCollapse()" title="展开侧边栏">▶</button>
  <div class="content" id="content">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>// 设备ID管理
function getDeviceId() {
  let deviceId = localStorage.getItem('bookmarks_device_id');
  if (!deviceId) {
    deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('bookmarks_device_id', deviceId);
  }
  return deviceId;
}

let deviceId = getDeviceId();

// 全局状态
let allCategories = [];
let recentData = [];
let currentCat = null; // 当前选中的分类索引, null=全部
let isSearchMode = false;
let cachedBookmarks = null; // 缓存的书签数据
let cachedUpdateTime = 0; // 缓存的后端更新时间

// 天气相关
const getWeatherCityKey = () => `weather_city_${deviceId}`;
let weatherCity = localStorage.getItem(getWeatherCityKey()) || '';
let weatherData = null;

// 主题相关
function initTheme() {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else {
    // 检测系统主题偏好
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = prefersDark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
    
    // 监听系统主题变化
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('theme')) {
        const newTheme = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
      }
    });
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const newTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
}

// 侧边栏折叠相关
function initSidebarCollapse() {
  const collapsed = localStorage.getItem('sidebar_collapsed') === 'true';
  if (collapsed) {
    document.getElementById('sidebar').classList.add('collapsed');
    const collapseBtn = document.querySelector('.collapse-btn');
    const expandBtn = document.querySelector('.sidebar-expand-btn');
    if (collapseBtn) {
      collapseBtn.textContent = '▶';
    }
    if (expandBtn) {
      expandBtn.classList.add('visible');
    }
  }
}

function toggleSidebarCollapse() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  const collapsed = sidebar.classList.contains('collapsed');
  localStorage.setItem('sidebar_collapsed', collapsed);
  
  // 更新按钮图标和展开按钮显示
  const collapseBtn = document.querySelector('.collapse-btn');
  const expandBtn = document.querySelector('.sidebar-expand-btn');
  if (collapseBtn) {
    collapseBtn.textContent = collapsed ? '▶' : '◀';
  }
  if (expandBtn) {
    expandBtn.classList.toggle('visible', collapsed);
  }
}

// 从 localStorage 读取缓存
function loadFromLocalStorage() {
  try {
    const cached = localStorage.getItem('bookmarks_cache');
    if (cached) {
      const data = JSON.parse(cached);
      cachedBookmarks = data.bookmarks;
      cachedUpdateTime = data.updateTime;
      return true;
    }
  } catch (e) {
    console.error("读取本地缓存失败", e);
  }
  return false;
}

// 保存到 localStorage
function saveToLocalStorage() {
  try {
    if (cachedBookmarks) {
      localStorage.setItem('bookmarks_cache', JSON.stringify({
        bookmarks: cachedBookmarks,
        updateTime: cachedUpdateTime
      }));
    }
  } catch (e) {
    console.error("保存本地缓存失败", e);
  }
}

// 日历功能
function updateCalendar() {
  const now = new Date();
  const weekdayStr = now.toLocaleDateString('zh-CN', {weekday: 'short'});
  const dateStr = now.toLocaleDateString('zh-CN', {month: 'short', day: 'numeric'});
  document.getElementById('calendar').innerHTML = `<div class="weekday">${weekdayStr}</div><div class="date">${dateStr}</div>`;
}

// 天气功能
const weatherIcons = {
  '晴': '☀️', '多云': '⛅', '阴': '☁️', '雨': '🌧️', 
  '雪': '❄️', '雾': '🌫️', '沙尘': '🌪️', '雷阵雨': '⛈️'
};

function getWeatherIcon(weather) {
  for (const key in weatherIcons) {
    if (weather.includes(key)) return weatherIcons[key];
  }
  return '🌤️';
}

async function fetchWeather(city) {
  try {
    // 使用免费的天气API (Open-Meteo，无需API key)
    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh`);
    const geoData = await geoRes.json();
    
    if (!geoData.results || geoData.results.length === 0) {
      console.error("城市未找到:", city);
      return null;
    }
    
    const {latitude, longitude, name} = geoData.results[0];
    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
    const weatherData = await weatherRes.json();
    
    return {
      city: name,
      temp: Math.round(weatherData.current_weather.temperature),
      weatherCode: weatherData.current_weather.weathercode
    };
  } catch (e) {
    console.error("获取天气失败:", e);
    return null;
  }
}

function updateWeatherDisplay(data) {
  if (!data) return;
  
  const weatherDesc = getWeatherDescription(data.weatherCode);
  document.getElementById('weatherIcon').textContent = getWeatherIcon(weatherDesc);
  document.getElementById('weatherTemp').textContent = `${data.temp}°`;
}

function getWeatherDescription(code) {
  const weatherCodes = {
    0: '晴', 1: '晴', 2: '多云', 3: '多云',
    45: '雾', 48: '雾',
    51: '小雨', 53: '小雨', 55: '小雨',
    61: '雨', 63: '雨', 65: '雨',
    71: '雪', 73: '雪', 75: '雪',
    80: '阵雨', 81: '阵雨', 82: '阵雨',
    95: '雷阵雨', 96: '雷阵雨', 99: '雷阵雨'
  };

async function initWeather() {
  if (weatherCity) {
    const data = await fetchWeather(weatherCity);
    if (data) {
      updateWeatherDisplay(data);
    }
  } else {
    // 自动定位
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const {latitude, longitude} = position.coords;
          try {
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude}&longitude=${longitude}&language=zh`);
            const geoData = await geoRes.json();
            const city = geoData.results?.[0]?.name || '未知位置';
            
            localStorage.setItem(getWeatherCityKey(), city);
            weatherCity = city;
            
            const data = await fetchWeather(city);
            if (data) updateWeatherDisplay(data);
          } catch (e) {
            console.error("反向地理编码失败", e);
          }
        },
        (error) => {
          console.error("定位失败", error);
        }
      );
    }
  }
}

// 简化书签标题
function cleanTitle(title, url) {
  if (!title) return url || '';
  let t = title;
  // 去掉常见后缀
  t = t.replace(/\s*[-_|–—]\s*(CSDN博客|博客园|简书|知乎|SegmentFault 思否|Stack Overflow|51CTO博客|腾讯云开发者社区|腾讯云|阿里云开发者社区|豆瓣|v2ray|Nexus|JFrog|OpenWrt|OpenVAS|GitHub|Gitee|GitLab|Jenkins|Docker|Kubernetes|Zabbix|Elastic|Grafana|Kibana|Harbor|Artifactory|Flyway|Liquibase|Ansible|Nacos|Spring|Oracle|中文社区|官方|官网|首页|Download|Documentation|Sign In|Login|Insecure|Page \d+|Issue #\d+|\(.*?\))/gi, '');
  t = t.replace(/\s*[-_|–—]\s*$/, '');
  t = t.trim();
  if (t.length > 60) t = t.substring(0, 57) + '...';
  return t || title;
}

async function loadBookmarks(keyword) {
  // 搜索时直接从后端获取，不使用缓存
  if (keyword) {
    const url = '/api/bookmarks?q=' + encodeURIComponent(keyword);
    const resp = await fetch(url);
    return await resp.json();
  }
  
  try {
    // 检查后端更新时间（2秒超时）
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 2000);
    
    const timeRes = await fetch('/api/update_time', {signal: controller.signal});
    const timeData = await timeRes.json();
    const backendUpdateTime = timeData.last_update || 0;
    clearTimeout(timeout);
    
    // 如果有缓存且缓存时间不晚于后端更新时间，使用缓存
    if (cachedBookmarks && cachedUpdateTime >= backendUpdateTime) {
      return cachedBookmarks;
    }
    
    // 否则从后端获取数据
    const resp = await fetch('/api/bookmarks');
    const data = await resp.json();
    
    // 更新缓存
    cachedBookmarks = data;
    cachedUpdateTime = backendUpdateTime;
    saveToLocalStorage();
    
    return data;
  } catch (e) {
    console.error("后端服务不可用或超时，使用缓存数据", e);
    // 后端不可用时，如果有缓存则使用缓存
    if (cachedBookmarks) {
      return cachedBookmarks;
    }
    // 如果连缓存都没有，返回空数据
    return {categories: [], total: 0, last_update: 0};
  }
}

// 构建目录树结构
function buildCategoryTree(categories) {
  const tree = {};
  
  categories.forEach(cat => {
    const path = cat.category.split(' / ');
    let current = tree;
    
    path.forEach((segment, index) => {
      if (!current[segment]) {
        current[segment] = {
          name: segment,
          fullPath: path.slice(0, index + 1).join(' / '),
          children: {},
          isLeaf: index === path.length - 1,
          category: cat,
          hasBookmarks: index === path.length - 1
        };
      } else if (index === path.length - 1) {
        // 如果这个节点已经存在但现在是叶子节点，标记为有书签
        current[segment].isLeaf = true;
        current[segment].hasBookmarks = true;
        current[segment].category = cat;
      }
      current = current[segment].children;
    });
  });
  
  return tree;
}

// 递归渲染目录树
function renderCategoryTree(tree, level, parentPath = '') {
  let html = '';
  const entries = Object.entries(tree).sort((a, b) => a[0].localeCompare(b[0]));
  
  entries.forEach(([name, node]) => {
    const indent = level * 16;
    const hasChildren = Object.keys(node.children).length > 0;
    const isActive = currentCat === node.fullPath && !isSearchMode;
    const isExpanded = expandedNodes.has(node.fullPath);
    
    // 只显示有书签的节点或有子节点的节点
    if (node.hasBookmarks || hasChildren) {
      const icon = hasChildren ? (isExpanded ? '�' : '�') : '📄';
      
      html += `<div class="menu-item ${isActive ? 'active' : ''}" 
               style="padding-left: ${10 + indent}px"
               data-category="${escAttr(node.fullPath)}"
               data-has-children="${hasChildren}"
               onclick="handleCategoryClick('${escJs(node.fullPath)}', ${hasChildren})">
        <span class="icon">${icon}</span>
        <span class="label">${escHtml(name)}</span>
        ${node.hasBookmarks ? `<span class="cnt">${node.category.items.length}</span>` : ''}
      </div>`;
      
      // 递归渲染子节点（只有展开时才显示）
      if (hasChildren && isExpanded) {
        html += renderCategoryTree(node.children, level + 1, node.fullPath);
      }
    }
  });
  
  return html;
}

// 长按处理
let longPressTimer = null;
let longPressElement = null;
let wasLongPress = false;

function setupLongPress() {
  document.querySelectorAll('.recent-item').forEach(item => {
    item.addEventListener('mousedown', startLongPress);
    item.addEventListener('touchstart', startLongPress);
    item.addEventListener('mouseup', cancelLongPress);
    item.addEventListener('mouseleave', cancelLongPress);
    item.addEventListener('touchend', cancelLongPress);
    item.addEventListener('click', handleRecentClick);
    
    // 拖拽事件（仅置顶项）
    if (item.classList.contains('pinned')) {
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragend', handleDragEnd);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('dragleave', handleDragLeave);
      item.addEventListener('drop', handleDrop);
    }
  });
}

function startLongPress(e) {
  if (e.target.classList.contains('delete-btn') || e.target.classList.contains('pin-btn')) return;
  
  wasLongPress = false;
  longPressElement = e.currentTarget;
  longPressTimer = setTimeout(() => {
    if (longPressElement) {
      longPressElement.classList.add('show-delete');
      wasLongPress = true;
    }
  }, 500);
}

function cancelLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

function handleRecentClick(e) {
  if (e.target.classList.contains('delete-btn')) return;
  
  const item = e.currentTarget;
  const url = item.dataset.url;
  
  // 如果显示删除按钮且不是长按触发的，先隐藏
  if (item.classList.contains('show-delete') && !wasLongPress) {
    item.classList.remove('show-delete');
    return;
  }
  
  // 重置长按标志
  wasLongPress = false;
  
  // 如果显示删除按钮是长按触发的，不执行跳转
  if (item.classList.contains('show-delete')) {
    return;
  }
  
  // 否则跳转
  const title = recentData.find(r => r.url === url)?.title || '';
  const category = recentData.find(r => r.url === url)?.category || '';
  window.open(url, '_blank');
  recordVisit(title, url, category);
}

// 拖拽相关
let draggedItem = null;

function handleDragStart(e) {
  draggedItem = e.currentTarget;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', e.currentTarget.dataset.url);
}

function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.recent-item').forEach(item => {
    item.classList.remove('drag-over');
  });
  draggedItem = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (e.currentTarget !== draggedItem && e.currentTarget.classList.contains('pinned')) {
    e.currentTarget.classList.add('drag-over');
  }
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  
  if (e.currentTarget === draggedItem || !e.currentTarget.classList.contains('pinned')) {
    return;
  }
  
  const draggedUrl = draggedItem.dataset.url;
  const targetUrl = e.currentTarget.dataset.url;
  
  // 获取当前置顶项的URL顺序
  const pinnedItems = document.querySelectorAll('.recent-item.pinned');
  const urls = Array.from(pinnedItems).map(item => item.dataset.url);
  
  // 重新排序
  const draggedIndex = urls.indexOf(draggedUrl);
  const targetIndex = urls.indexOf(targetUrl);
  
  if (draggedIndex !== -1 && targetIndex !== -1) {
    urls.splice(draggedIndex, 1);
    urls.splice(targetIndex, 0, draggedUrl);
    
    // 保存新顺序
    await fetch('/api/recent/reorder', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({urls, device_id: deviceId})
    });
    
    await loadRecent();
    renderOverview();
  }
}

// 工具函数
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return escHtml(s); }
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

init();
</script>
</body>
</html>
