<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks Nav</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --sidebar-w: 240px;
  --primary: #5b6abf;
  --primary-light: #eef0ff;
  --primary-dark: #4a57a3;
  --bg: #f5f6fa;
  --card: #fff;
  --text: #2c3e50;
  --text2: #8795a1;
  --border: #e8ecf1;
  --shadow: 0 2px 8px rgba(91,106,191,.08);
  --radius: 10px;
}
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* === 顶栏 === */
.header { background: linear-gradient(135deg, #5b6abf 0%, #7c5cbf 100%); padding: 14px 24px 12px; display: grid; grid-template-columns: 1fr 4fr 1fr; align-items: center; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 12px rgba(91,106,191,.2); gap: 8px; }
.header .logo-wrap { cursor: pointer; display: flex; align-items: center; gap: 8px; }
.header .logo-icon { display: none; font-size: 24px; }
.header .logo { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.header .stats { color: rgba(255,255,255,.6); font-size: 11px; white-space: nowrap; margin-top: 2px; }
.search-box { justify-self: center; width: 100%; position: relative; }
.search-box input { width: 100%; padding: 14px 50px 14px 20px; border: none; border-radius: 24px; font-size: 16px; outline: none; background: rgba(255,255,255,.92); transition: all .2s; }
.search-box input:focus { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.3); }
.search-box .clear-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #999; font-size: 16px; display: none; line-height: 1; }
.search-box .clear-btn:hover { color: #333; }
.header .refresh-btn { background: rgba(255,255,255,.18); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; transition: background .2s; justify-self: end; }
.header .refresh-btn:hover { background: rgba(255,255,255,.3); }
.search-icon-btn { display: none; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 8px; }

/* === 主体 === */
.main { display: flex; flex: 1; overflow: hidden; }

/* === 左侧栏 === */
.sidebar { width: var(--sidebar-w); background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 2px; }
.sidebar-header { padding: 16px 18px 10px; font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; border-bottom: 1px solid var(--border); }
.sidebar-menu { flex: 1; padding: 6px 0; }
.menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; font-size: 13.5px; color: var(--text); cursor: pointer; transition: all .15s; border-left: 3px solid transparent; text-decoration: none; }
.menu-item:hover { background: var(--primary-light); color: var(--primary); }
.menu-item.active { background: var(--primary-light); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }
.menu-item .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.menu-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-item .cnt { margin-left: auto; font-size: 11px; color: var(--text2); background: var(--bg); padding: 1px 7px; border-radius: 10px; flex-shrink: 0; }

/* === 右侧内容 === */
.content { flex: 1; overflow-y: auto; padding: 20px 28px 40px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: #d0d5dd; border-radius: 3px; }

/* 最近常用 */
.recent-section { margin-bottom: 24px; }
.recent-section h2 { font-size: 14px; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.recent-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.recent-item { background: var(--card); border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: all .2s; box-shadow: var(--shadow); max-width: 240px; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); position: relative; }
.recent-item .recent-content { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.recent-item:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(91,106,191,.15); color: var(--primary); }
.recent-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
.recent-item .delete-btn { position: absolute; top: -6px; left: -6px; width: 20px; height: 20px; background: #e74c3c; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; border: 2px solid var(--card); }
.recent-item .pin-btn { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: #f39c12; color: #fff; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; z-index: 10; border: 2px solid var(--card); }
.recent-item.pinned .pin-btn { background: #e67e22; }
.recent-item.show-delete .delete-btn { display: flex; }
.recent-item.show-delete .pin-btn { display: flex; }
.recent-item.show-delete .recent-content { animation: shake 0.5s ease-in-out infinite; }
.recent-item.dragging { opacity: 0.5; }
.recent-item.drag-over { border: 2px dashed var(--primary); }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px) rotate(-1deg); }
  75% { transform: translateX(3px) rotate(1deg); }
}

/* 分类视图 - 首页概览 */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.overview-card { background: var(--card); border-radius: var(--radius); padding: 18px 16px; box-shadow: var(--shadow); cursor: pointer; transition: all .2s; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.overview-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,106,191,.12); }
.overview-card .oc-icon { font-size: 26px; }
.overview-card .oc-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
.overview-card .oc-count { font-size: 12px; color: var(--text2); }

/* 分类详情 - 书签列表 */
.category-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
.category-title .back-btn { font-size: 14px; color: var(--primary); cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.category-title .back-btn:hover { text-decoration: underline; }
.category-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 16px; }

.bookmark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; max-width: 1400px; margin: 0 auto; }
.bookmark-item { background: var(--card); border-radius: 8px; padding: 12px 14px; transition: all .15s; cursor: pointer; text-decoration: none; color: var(--text); display: flex; align-items: flex-start; gap: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.04); min-height: 56px; }
.bookmark-item:hover { box-shadow: 0 4px 12px rgba(91,106,191,.12); transform: translateY(-1px); }
.bookmark-item .bm-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--primary); flex-shrink: 0; font-weight: 700; overflow: hidden; }
.bookmark-item .bm-icon img { width: 20px; height: 20px; border-radius: 3px; }
.bookmark-item .bm-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.bookmark-item .bm-title { font-size: 13.5px; font-weight: 500; line-height: 1.4; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -ms-overflow-style: none; padding-right: 4px; }
.bookmark-item .bm-title::-webkit-scrollbar { display: none; }
.bookmark-item:hover .bm-title { color: var(--primary); }
.bookmark-item .bm-url { font-size: 11px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.loading { text-align: center; padding: 60px; color: var(--text2); font-size: 15px; }
.empty { text-align: center; padding: 40px; color: #bbb; font-size: 14px; }

/* 分类图标颜色 */
.ico-0 { color: #e74c3c; } .ico-1 { color: #e67e22; } .ico-2 { color: #f1c40f; } .ico-3 { color: #2ecc71; }
.ico-4 { color: #1abc9c; } .ico-5 { color: #3498db; } .ico-6 { color: #9b59b6; } .ico-7 { color: #e91e63; }

/* 移动端 */
.sidebar-toggle { display: none; background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; padding: 4px; }
.header .left-col { display: flex; align-items: center; gap: 8px; }

/* 大屏: 侧边栏加宽, 更多列 */
@media (min-width: 1400px) {
  :root { --sidebar-w: 280px; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .overview-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}

/* 中屏: 侧边栏缩窄 */
@media (max-width: 1024px) {
  :root { --sidebar-w: 200px; }
  .menu-item { padding: 8px 14px; font-size: 13px; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
}

/* 小屏: 隐藏侧边栏, 汉堡菜单 */
@media (max-width: 768px) {
  .sidebar-toggle { display: block; }
  .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; width: 250px; z-index: 300; transition: left .25s; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
  .sidebar.open { left: 0; }
  .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 299; }
  .sidebar-overlay.open { display: block; }
  .bookmark-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .overview-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .header .stats { display: none; }
  .content { padding: 16px 16px 32px; }
  .search-box { width: min(500px, calc(100% - 160px)); }
  
  /* 小屏搜索和刷新按钮样式 */
  .search-icon-btn { display: block; }
  .search-box { display: none; position: absolute; left: 50%; transform: translateX(-50%); width: calc(100% - 120px); z-index: 250; }
  .search-box.show { display: block; }
  .header .refresh-btn { padding: 8px 10px; font-size: 16px; }
  .header .refresh-btn span { display: none; }
  .header { grid-template-columns: auto 1fr auto; }
  .header .left-col { width: auto; }
}

/* 超小屏: 只显示图标 */
@media (max-width: 480px) {
  .header .logo { display: none; }
  .header .logo-icon { display: block; }
  .header .stats { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="left-col">
    <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
    <div class="logo-wrap" onclick="location.reload()">
      <span class="logo-icon">&#128208;</span>
      <div>
        <div class="logo">Bookmarks</div>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
  <button class="search-icon-btn" onclick="toggleSearchBox()">&#128269;</button>
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="搜索书签..." autocomplete="off">
    <span class="clear-btn" id="clearBtn">&times;</span>
  </div>
  <button class="refresh-btn" onclick="location.reload()">&#8635; <span>刷新</span></button>
</div>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="main">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">目录导航</div>
    <div class="sidebar-menu" id="sidebarMenu"></div>
  </div>
  <div class="content" id="content">
    <div class="loading">加载中...</div>
  </div>
</div>

<script>// 设备ID管理
function getDeviceId() {
  let deviceId = localStorage.getItem('bookmarks_device_id');
  if (!deviceId) {
    deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('bookmarks_device_id', deviceId);
  }
  return deviceId;
}

let deviceId = getDeviceId();

// 全局状态
let allCategories = [];
let recentData = [];
let currentCat = null; // 当前选中的分类索引, null=全部
let isSearchMode = false;
let cachedBookmarks = null; // 缓存的书签数据
let cachedUpdateTime = 0; // 缓存的后端更新时间

// 从 localStorage 读取缓存
function loadFromLocalStorage() {
  try {
    const cached = localStorage.getItem('bookmarks_cache');
    if (cached) {
      const data = JSON.parse(cached);
      cachedBookmarks = data.bookmarks;
      cachedUpdateTime = data.updateTime;
      return true;
    }
  } catch (e) {
    console.error("读取本地缓存失败", e);
  }
  return false;
}

// 保存到 localStorage
function saveToLocalStorage() {
  try {
    if (cachedBookmarks) {
      localStorage.setItem('bookmarks_cache', JSON.stringify({
        bookmarks: cachedBookmarks,
        updateTime: cachedUpdateTime
      }));
    }
  } catch (e) {
    console.error("保存本地缓存失败", e);
  }
}

// 分类图标
const CAT_ICONS = ['📂','🎬','📝','💻','🎮','🎧','🔧','🏠','📚','💰','🛒','✈️','🖼️','👔','🔗','🌍','📊','🗂️','⚙️','🧰','📁','🔔','📌','🎯'];
function catIcon(i) { return CAT_ICONS[i % CAT_ICONS.length]; }

// 书签图标：用favicon或首字母
function bmIconHtml(url, title) {
  try {
    const u = new URL(url);
    const fav = u.origin + '/favicon.ico';
    const letter = (title || u.hostname)[0].toUpperCase();
    return `<div class="bm-icon" data-fav="${escAttr(fav)}" data-letter="${escAttr(letter)}">${letter}</div>`;
  } catch { return `<div class="bm-icon">?</div>`; }
}

// 尝试加载favicon
function loadFavicons() {
  document.querySelectorAll('.bm-icon[data-fav]').forEach(el => {
    const fav = el.dataset.fav;
    const letter = el.dataset.letter;
    const img = new Image();
    img.onload = () => { el.innerHTML = ''; const i = document.createElement('img'); i.src = fav; el.appendChild(i); };
    img.onerror = () => {};
    img.src = fav;
  });
}

// 简化书签标题
function cleanTitle(title, url) {
  if (!title) return url || '';
  let t = title;
  // 去掉常见后缀
  t = t.replace(/\s*[-_|–—]\s*(CSDN博客|博客园|简书|知乎|SegmentFault 思否|Stack Overflow|51CTO博客|腾讯云开发者社区|腾讯云|阿里云开发者社区|豆瓣|v2ray|Nexus|JFrog|OpenWrt|OpenVAS|GitHub|Gitee|GitLab|Jenkins|Docker|Kubernetes|Zabbix|Elastic|Grafana|Kibana|Harbor|Artifactory|Flyway|Liquibase|Ansible|Nacos|Spring|Oracle|中文社区|官方|官网|首页|Download|Documentation|Sign In|Login|Insecure|Page \d+|Issue #\d+|\(.*?\))/gi, '');
  t = t.replace(/\s*[-_|–—]\s*$/, '');
  t = t.trim();
  if (t.length > 60) t = t.substring(0, 57) + '...';
  return t || title;
}

async function loadBookmarks(keyword) {
  // 搜索时直接从后端获取，不使用缓存
  if (keyword) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 2000);
      const url = '/api/bookmarks?q=' + encodeURIComponent(keyword);
      const resp = await fetch(url, {signal: controller.signal});
      clearTimeout(timeout);
      return await resp.json();
    } catch (e) {
      console.error("搜索请求失败或超时", e);
      return {categories: [], total: 0};
    }
  }
  
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 2000);
    
    // 检查后端更新时间
    const timeRes = await fetch('/api/update_time', {signal: controller.signal});
    const timeData = await timeRes.json();
    const backendUpdateTime = timeData.last_update || 0;
    
    // 如果有缓存且缓存时间不晚于后端更新时间，使用缓存
    if (cachedBookmarks && cachedUpdateTime >= backendUpdateTime) {
      clearTimeout(timeout);
      return cachedBookmarks;
    }
    
    // 否则从后端获取数据
    const resp = await fetch('/api/bookmarks', {signal: controller.signal});
    const data = await resp.json();
    clearTimeout(timeout);
    
    // 更新缓存
    cachedBookmarks = data;
    cachedUpdateTime = backendUpdateTime;
    saveToLocalStorage();
    
    return data;
  } catch (e) {
    console.error("后端服务不可用或超时，使用缓存数据", e);
    // 后端不可用时，如果有缓存则使用缓存
    if (cachedBookmarks) {
      return cachedBookmarks;
    }
    // 如果连缓存都没有，返回空数据
    return {categories: [], total: 0, last_update: 0};
  }
}

async function loadRecent() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 2000);
    const res = await fetch(`/api/recent?device_id=${encodeURIComponent(deviceId)}`, {signal: controller.signal});
    clearTimeout(timeout);
    const data = await res.json();
    recentData = data.items || [];
  } catch (e) {
    console.error("加载最近常用失败或超时", e);
    recentData = [];
  }
}

async function recordVisit(title, url, category) {
  await fetch('/api/visit', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title, url, category, device_id: deviceId})
  });
  loadRecent();
}

// 渲染侧边栏
function renderSidebar(categories) {
  const menu = document.getElementById('sidebarMenu');
  let html = `<div class="menu-item ${currentCat === null && !isSearchMode ? 'active' : ''}" onclick="showAll()">
    <span class="icon">🏠</span><span class="label">全部目录</span>
    <span class="cnt">${categories.reduce((s,c) => s + c.items.length, 0)}</span>
  </div>`;
  categories.forEach((cat, i) => {
    const name = escHtml(cat.category);
    const shortName = name.split(' / ').pop();
    html += `<div class="menu-item ${currentCat === i && !isSearchMode ? 'active' : ''}" onclick="showCategory(${i})">
      <span class="icon ico-${i % 8}">${catIcon(i)}</span>
      <span class="label" title="${name}">${escHtml(shortName)}</span>
      <span class="cnt">${cat.items.length}</span>
    </div>`;
  });
  menu.innerHTML = html;
}

// 显示全部目录概览
function showAll() {
  currentCat = null;
  isSearchMode = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  renderSidebar(allCategories);
  renderOverview();
  closeSidebar();
}

// 显示单个分类
function showCategory(idx) {
  currentCat = idx;
  isSearchMode = false;
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  renderSidebar(allCategories);
  renderCategoryDetail(idx);
  closeSidebar();
}

// 概览视图
function renderOverview() {
  const content = document.getElementById('content');
  let html = '';

  // 最近常用
  if (recentData.length > 0) {
    // 分离置顶和未置顶
    const pinned = recentData.filter(item => item.pinned);
    const unpinned = recentData.filter(item => !item.pinned);
    
    html += '<div class="recent-section"><h2>⭐ 最近常用</h2><div class="recent-grid">';
    
    // 渲染置顶项
    pinned.forEach((item, index) => {
      html += `<div class="recent-item pinned" data-url="${escAttr(item.url)}" data-index="${index}" draggable="true">
        <span class="delete-btn" onclick="deleteRecent(event, '${escJs(item.url)}')">&times;</span>
        <span class="pin-btn" onclick="togglePin(event, '${escJs(item.url)}', false)">&#128274;</span>
        <span class="dot"></span>
        <span class="recent-content">${escHtml(cleanTitle(item.title, item.url))}</span>
      </div>`;
    });
    
    // 渲染未置顶项
    unpinned.forEach((item, index) => {
      html += `<div class="recent-item" data-url="${escAttr(item.url)}" data-index="${index}">
        <span class="delete-btn" onclick="deleteRecent(event, '${escJs(item.url)}')">&times;</span>
        <span class="pin-btn" onclick="togglePin(event, '${escJs(item.url)}', true)">&#128205;</span>
        <span class="dot"></span>
        <span class="recent-content">${escHtml(cleanTitle(item.title, item.url))}</span>
      </div>`;
    });
    
    html += '</div></div>';
  }

  // 目录卡片
  html += '<div class="overview-grid">';
  allCategories.forEach((cat, i) => {
    const name = escHtml(cat.category);
    const shortName = name.split(' / ').pop();
    html += `<div class="overview-card" onclick="showCategory(${i})">
      <span class="oc-icon ico-${i % 8}">${catIcon(i)}</span>
      <span class="oc-name">${escHtml(shortName)}</span>
      <span class="oc-count">${cat.items.length} 个书签</span>
    </div>`;
  });
  html += '</div>';
  content.innerHTML = html;
  setupLongPress();
}

// 分类详情视图
function renderCategoryDetail(idx) {
  const cat = allCategories[idx];
  if (!cat) return;
  const content = document.getElementById('content');
  const name = escHtml(cat.category);

  let html = `<div class="category-title">
    <span class="back-btn" onclick="showAll()">← 返回</span>
    <span class="ico-${idx % 8}">${catIcon(idx)}</span> ${name}
  </div>
  <div class="category-subtitle">${cat.items.length} 个书签</div>
  <div class="bookmark-grid">`;

  cat.items.forEach(item => {
    const t = escHtml(cleanTitle(item.title, item.url));
    const u = escHtml(item.url);
    html += `<a class="bookmark-item" href="${escAttr(item.url)}" target="_blank" rel="noopener" onclick="recordVisit('${escJs(item.title)}','${escJs(item.url)}','${escJs(cat.category)}')">
      ${bmIconHtml(item.url, item.title)}
      <div class="bm-info"><div class="bm-title">${t}</div><div class="bm-url">${u}</div></div>
    </a>`;
  });
  html += '</div>';
  content.innerHTML = html;
  loadFavicons();
}

// 搜索结果视图
function renderSearch(data) {
  const content = document.getElementById('content');
  if (!data.categories || data.categories.length === 0) {
    content.innerHTML = '<div class="empty">未找到匹配的书签</div>';
    return;
  }
  let html = `<div class="category-title">🔍 搜索结果</div>
    <div class="category-subtitle">共 ${data.total} 个匹配</div>`;
  data.categories.forEach(cat => {
    html += `<div style="margin-bottom:16px;">
      <div style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;">${escHtml(cat.category)}</div>
      <div class="bookmark-grid">`;
    cat.items.forEach(item => {
      const t = escHtml(cleanTitle(item.title, item.url));
      const u = escHtml(item.url);
      html += `<a class="bookmark-item" href="${escAttr(item.url)}" target="_blank" rel="noopener" onclick="recordVisit('${escJs(item.title)}','${escJs(item.url)}','${escJs(cat.category)}')">
        ${bmIconHtml(item.url, item.title)}
        <div class="bm-info"><div class="bm-title">${t}</div><div class="bm-url">${u}</div></div>
      </a>`;
    });
    html += '</div></div>';
  });
  content.innerHTML = html;
  loadFavicons();
}

// 初始化
async function init() {
  // 先从 localStorage 加载缓存，实现即时显示
  loadFromLocalStorage();
  
  // 如果有缓存，先显示缓存内容
  if (cachedBookmarks) {
    allCategories = cachedBookmarks.categories || [];
    renderSidebar(allCategories);
    renderOverview();
    const total = cachedBookmarks.total || 0;
    const updateTime = cachedBookmarks.last_update ? new Date(cachedBookmarks.last_update * 1000).toLocaleString('zh-CN') : '-';
    document.getElementById('stats').textContent = `${total} 书签 | ${updateTime}`;
  }
  
  // 然后在后台检查更新
  const [data] = await Promise.all([loadBookmarks(), loadRecent()]);
  allCategories = data.categories || [];
  renderSidebar(allCategories);
  renderOverview();
  // 统计
  const total = data.total || 0;
  const updateTime = data.last_update ? new Date(data.last_update * 1000).toLocaleString('zh-CN') : '-';
  document.getElementById('stats').textContent = `${total} 书签 | ${updateTime}`;
  
  // 初始化搜索事件监听
  setupSearch();
}

// 搜索
let searchTimer = null;

function setupSearch() {
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  
  if (!searchInput || !clearBtn) return;
  
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimer);
    const v = this.value.trim();
    clearBtn.style.display = v ? 'block' : 'none';
    if (!v) { isSearchMode = false; renderSidebar(allCategories); if (currentCat !== null) renderCategoryDetail(currentCat); else renderOverview(); return; }
    searchTimer = setTimeout(async () => {
      isSearchMode = true;
      currentCat = null;
      const data = await loadBookmarks(v);
      renderSidebar(allCategories);
      renderSearch(data);
    }, 300);
  });

  clearBtn.addEventListener('click', function() {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    isSearchMode = false;
    renderSidebar(allCategories);
    if (currentCat !== null) renderCategoryDetail(currentCat); else renderOverview();
  });
}

// 移动端侧边栏
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// 小屏搜索框切换
function toggleSearchBox() {
  const searchBox = document.getElementById('searchBox');
  searchBox.classList.toggle('show');
  if (searchBox.classList.contains('show')) {
    document.getElementById('searchInput').focus();
  }
}

// 长按处理
let longPressTimer = null;
let longPressElement = null;
let wasLongPress = false;

function setupLongPress() {
  document.querySelectorAll('.recent-item').forEach(item => {
    item.addEventListener('mousedown', startLongPress);
    item.addEventListener('touchstart', startLongPress);
    item.addEventListener('mouseup', cancelLongPress);
    item.addEventListener('mouseleave', cancelLongPress);
    item.addEventListener('touchend', cancelLongPress);
    item.addEventListener('click', handleRecentClick);
    
    // 拖拽事件（仅置顶项）
    if (item.classList.contains('pinned')) {
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragend', handleDragEnd);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('dragleave', handleDragLeave);
      item.addEventListener('drop', handleDrop);
    }
  });
}

function startLongPress(e) {
  if (e.target.classList.contains('delete-btn') || e.target.classList.contains('pin-btn')) return;
  
  wasLongPress = false;
  longPressElement = e.currentTarget;
  longPressTimer = setTimeout(() => {
    if (longPressElement) {
      longPressElement.classList.add('show-delete');
      wasLongPress = true;
    }
  }, 500);
}

function cancelLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

function handleRecentClick(e) {
  if (e.target.classList.contains('delete-btn')) return;
  
  const item = e.currentTarget;
  const url = item.dataset.url;
  
  // 如果显示删除按钮且不是长按触发的，先隐藏
  if (item.classList.contains('show-delete') && !wasLongPress) {
    item.classList.remove('show-delete');
    return;
  }
  
  // 重置长按标志
  wasLongPress = false;
  
  // 如果显示删除按钮是长按触发的，不执行跳转
  if (item.classList.contains('show-delete')) {
    return;
  }
  
  // 否则跳转
  const title = recentData.find(r => r.url === url)?.title || '';
  const category = recentData.find(r => r.url === url)?.category || '';
  window.open(url, '_blank');
  recordVisit(title, url, category);
}

// 删除最近常用项
async function deleteRecent(event, url) {
  event.stopPropagation();
  event.preventDefault();
  
  await fetch('/api/recent/delete', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url, device_id: deviceId})
  });
  
  await loadRecent();
  renderOverview();
}

// 置顶/取消置顶
async function togglePin(event, url, pin) {
  event.stopPropagation();
  event.preventDefault();
  
  await fetch('/api/recent/pin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({url, pin, device_id: deviceId})
  });
  
  await loadRecent();
  renderOverview();
}

// 拖拽相关
let draggedItem = null;

function handleDragStart(e) {
  draggedItem = e.currentTarget;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', e.currentTarget.dataset.url);
}

function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.recent-item').forEach(item => {
    item.classList.remove('drag-over');
  });
  draggedItem = null;
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (e.currentTarget !== draggedItem && e.currentTarget.classList.contains('pinned')) {
    e.currentTarget.classList.add('drag-over');
  }
}

function handleDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

async function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  
  if (e.currentTarget === draggedItem || !e.currentTarget.classList.contains('pinned')) {
    return;
  }
  
  const draggedUrl = draggedItem.dataset.url;
  const targetUrl = e.currentTarget.dataset.url;
  
  // 获取当前置顶项的URL顺序
  const pinnedItems = document.querySelectorAll('.recent-item.pinned');
  const urls = Array.from(pinnedItems).map(item => item.dataset.url);
  
  // 重新排序
  const draggedIndex = urls.indexOf(draggedUrl);
  const targetIndex = urls.indexOf(targetUrl);
  
  if (draggedIndex !== -1 && targetIndex !== -1) {
    urls.splice(draggedIndex, 1);
    urls.splice(targetIndex, 0, draggedUrl);
    
    // 保存新顺序
    await fetch('/api/recent/reorder', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({urls, device_id: deviceId})
    });
    
    await loadRecent();
    renderOverview();
  }
}

// 工具函数
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return escHtml(s); }
function escJs(s) { return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"'); }

init();
</script>
