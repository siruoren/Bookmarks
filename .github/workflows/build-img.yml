name: Build Image

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          # 从 version.txt 读取版本号
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "错误: version.txt 为空或不存在"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "==> Version: $VERSION (来源: version.txt)"

      - name: Build Docker image
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOCKER_TAG="${VERSION}"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_ENV"
          echo "==> Docker tag: seetab:${DOCKER_TAG}"
          docker build -t "seetab:${DOCKER_TAG}" .

      - name: Save Docker image to tgz
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DOCKER_TAG="${{ env.docker_tag }}"
          mkdir -p dist
          TGZ_FILE="dist/seetab-v${VERSION}.tgz"
          echo "==> 保存镜像 seetab:${DOCKER_TAG} -> ${TGZ_FILE}"
          docker save "seetab:${DOCKER_TAG}" | gzip > "$TGZ_FILE"
          echo "==> 已生成: ${TGZ_FILE} ($(du -h "$TGZ_FILE" | cut -f1))"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seetab-img-v${{ steps.version.outputs.version }}
          path: dist/*.tgz
          retention-days: 90

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
